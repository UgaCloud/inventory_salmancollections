{% extends "base.html" %}
{% load ui %}
{% block title %}Receipt {{ sale.number }} · {{ shop.name }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-md">
  <div class="no-print mb-3 flex flex-wrap items-center justify-between gap-2">
    <a href="{% url 'sales:detail' sale.pk %}" data-nav class="btn btn-secondary btn-sm">&larr; Sale details</a>
    <div class="flex gap-2">
      <button type="button" class="btn btn-primary btn-sm" data-print>Print receipt</button>
      <a href="{% url 'sales:pos' %}" data-nav class="btn btn-secondary btn-sm">New sale</a>
    </div>
  </div>
  {% include "sales/_receipt.html" %}
</div>
{% endblock %}
