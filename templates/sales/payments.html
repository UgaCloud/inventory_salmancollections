{% extends "base.html" %}
{% load ui %}
{% block title %}Customer payments · {{ shop.name }}{% endblock %}
{% block content %}
<div class="mb-5 flex flex-wrap items-end justify-between gap-3">
  <div>
    <h1 class="page-title">Payment history</h1>
    <p class="page-subtitle">Payments received against outstanding customer balances.</p>
  </div>
  <a href="{% url 'customers:customers' %}" data-nav class="btn btn-secondary">Customers</a>
</div>

<form method="get" action="{% url 'customers:payments' %}" data-filter-form data-list-url="{% url 'customers:payments' %}" class="card mb-4 flex flex-wrap items-end gap-2 p-3">
  <div class="min-w-[12rem] flex-1">
    <label for="payments-q" class="label">Search</label>
    <input type="search" id="payments-q" name="q" value="{{ q }}" placeholder="Customer name or payment reference" autocomplete="off">
  </div>
  <a href="{% url 'customers:payments' %}" data-nav class="btn btn-ghost">Reset</a>
</form>

<div data-list-container data-list-url="{% url 'customers:payments' %}">
  {% include "sales/_payments_list.html" %}
</div>
{% endblock %}
