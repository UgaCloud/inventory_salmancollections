{% load ui %}
{% if page.paginator.num_pages > 1 %}
  <nav class="flex flex-wrap items-center justify-between gap-2 border-t border-slate-100 px-3 py-3 text-sm" aria-label="Pagination">
    <span class="text-xs text-slate-500">
      Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} records
    </span>
    <div class="flex items-center gap-1">
      {% if page.has_previous %}
        <a class="btn btn-secondary btn-sm" href="?{% query_update request page=page.previous_page_number %}" data-page-link>Previous</a>
      {% endif %}
      {% if page.has_next %}
        <a class="btn btn-secondary btn-sm" href="?{% query_update request page=page.next_page_number %}" data-page-link>Next</a>
      {% endif %}
    </div>
  </nav>
{% endif %}
