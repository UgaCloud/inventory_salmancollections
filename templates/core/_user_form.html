{% if editing %}
  <div class="mb-3 flex items-center justify-between">
    <h2 class="section-title">Edit staff account</h2>
    <button type="button" class="text-xs font-semibold text-brand-600 hover:underline" data-form-close>Add new</button>
  </div>
{% else %}
  <h2 class="section-title mb-3">Add staff account</h2>
{% endif %}
<form method="post" action="{{ list_url }}" data-ajax-form data-list-url="{{ list_url }}" novalidate>
  {% csrf_token %}
  {% if editing %}<input type="hidden" name="id" value="{{ editing.pk }}">{% endif %}
  {% include "partials/form_fields.html" %}
  <button type="submit" class="btn btn-primary btn-block">Save user</button>
</form>
<p class="mt-3 text-xs text-slate-500">Roles are managed under <a href="{% url 'core:roles' %}" data-nav class="font-semibold text-brand-600 hover:underline">Roles &amp; permissions</a>. Changes to a role apply to everyone with that role.</p>
