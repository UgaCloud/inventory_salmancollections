{% extends "base.html" %}
{% load ui %}
{% block title %}Audit log · {{ shop.name }}{% endblock %}
{% block content %}
<div class="mb-5">
  <h1 class="page-title">Audit log</h1>
  <p class="page-subtitle">Sensitive activities recorded automatically, newest first.</p>
</div>

<form method="get" action="{% url 'core:audit' %}" data-filter-form data-list-url="{% url 'core:audit' %}" class="card mb-4 flex flex-wrap items-end gap-2 p-3">
  <div class="min-w-[12rem] flex-1">
    <label for="audit-q" class="label">Search</label>
    <input type="search" id="audit-q" name="q" value="{{ q }}" placeholder="Action, user or detail" autocomplete="off">
  </div>
  <div class="w-48">
    <label for="audit-action" class="label">Action</label>
    <select id="audit-action" name="action">
      <option value="">All actions</option>
      {% for item in actions %}
        <option value="{{ item }}" {% if item == action %}selected{% endif %}>{{ item }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="w-40">
    <label for="audit-date" class="label">Date</label>
    <input type="date" id="audit-date" name="date" value="{{ day }}">
  </div>
  <a href="{% url 'core:audit' %}" data-nav class="btn btn-ghost">Reset</a>
</form>

<div data-list-container data-list-url="{% url 'core:audit' %}">
  {% include "core/_audit_list.html" %}
</div>
{% endblock %}
