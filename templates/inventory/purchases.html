{% extends "base.html" %}
{% load ui %}
{% block title %}Purchase history · {{ shop.name }}{% endblock %}
{% block content %}
<div class="mb-5 flex flex-wrap items-end justify-between gap-3">
  <div>
    <h1 class="page-title">Purchase history</h1>
    <p class="page-subtitle">Every stock receipt with its supplier, cost and batches.</p>
  </div>
  <div class="flex gap-2">
    <a href="{% url 'inventory:suppliers' %}" data-nav class="btn btn-secondary">Suppliers</a>
    <a href="{% url 'inventory:receive' %}" data-nav class="btn btn-primary">Receive stock</a>
  </div>
</div>

<form method="get" action="{% url 'inventory:purchases' %}" data-filter-form data-list-url="{% url 'inventory:purchases' %}" class="card mb-4 flex flex-wrap items-end gap-2 p-3">
  <div class="min-w-[12rem] flex-1">
    <label for="purchase-q" class="label">Search</label>
    <input type="search" id="purchase-q" name="q" value="{{ filters.q }}" placeholder="Purchase number, reference or supplier" autocomplete="off">
  </div>
  <div class="w-48">
    <label for="purchase-supplier" class="label">Supplier</label>
    <select id="purchase-supplier" name="supplier">
      <option value="">All suppliers</option>
      {% for supplier in suppliers %}
        <option value="{{ supplier.pk }}" {% if filters.supplier == supplier.pk|stringformat:"s" %}selected{% endif %}>{{ supplier.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="w-40">
    <label for="purchase-start" class="label">From</label>
    <input type="date" id="purchase-start" name="start" value="{{ filters.start }}">
  </div>
  <div class="w-40">
    <label for="purchase-end" class="label">To</label>
    <input type="date" id="purchase-end" name="end" value="{{ filters.end }}">
  </div>
  <a href="{% url 'inventory:purchases' %}" data-nav class="btn btn-ghost">Reset</a>
</form>

<div data-list-container data-list-url="{% url 'inventory:purchases' %}">
  {% include "inventory/_purchases_list.html" %}
</div>
{% endblock %}
